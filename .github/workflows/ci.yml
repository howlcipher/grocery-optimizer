name: CI

on:
  push:
    branches: [main, "feat/**", "agy/**"]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend Lint, Types & Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: grocery_optimizer_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Install dependencies
        working-directory: backend
        run: |
          uv venv
          uv pip install -e ".[dev]"

      - name: Run Ruff Lint Check
        working-directory: backend
        run: |
          .venv/bin/ruff check app tests

      - name: Run Mypy Type Check
        working-directory: backend
        run: |
          .venv/bin/mypy

      - name: Run Database Migrations & Seed
        working-directory: backend
        env:
          DATABASE_URL: postgresql+psycopg://test_user:test_password@localhost:5432/grocery_optimizer_test
        run: |
          .venv/bin/alembic upgrade head
          .venv/bin/python app/seed/seeder.py

      - name: Run Pytest Suite
        working-directory: backend
        env:
          DATABASE_URL: postgresql+psycopg://test_user:test_password@localhost:5432/grocery_optimizer_test
        run: |
          .venv/bin/pytest tests

  frontend:
    name: Frontend Lint, Types, Tests & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Run ESLint
        working-directory: frontend
        run: npm run lint

      - name: Run TypeScript Type Check
        working-directory: frontend
        run: npm run typecheck

      - name: Run Vitest Suite
        working-directory: frontend
        run: npm test

      - name: Run Production Build
        working-directory: frontend
        run: npm run build
