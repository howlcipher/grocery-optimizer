version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: grocery-optimizer-db
    environment:
      POSTGRES_USER: grocery_user
      POSTGRES_PASSWORD: grocery_pass
      POSTGRES_DB: grocery_optimizer
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U grocery_user -d grocery_optimizer"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
